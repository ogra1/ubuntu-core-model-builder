[package]
name = "snapstore-auth"
version = "0.1.1"
edition = "2021"
description = "Interactive OAuth2 + 2FA (Ubuntu One SSO) login for the Snap Store with macaroon issuance. FFI-ready Rust backend for Flutter apps (flutter_rust_bridge / UniFFI)."
license = "MIT"

[lib]
name = "snapstore_auth"
# cdylib    -> iOS / macOS (dynamic) + Android JNI
# staticlib -> Android (static) / embedded desktop
# rlib      -> cargo test / native Rust consumers
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serial_test = "3"
