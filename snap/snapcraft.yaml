name: model-builder
title: Model Builder
version: '0.1.9'
summary: GUI for creating and signing Ubuntu Core model assertions
description: |
  A graphical tool to create, edit, and sign Ubuntu Core model
  assertions. Searches the snap store, resolves snap IDs automatically,
  manages signing keys, and integrates with snapcraft.

contact: https://github.com/ogra1/ubuntu-core-model-builder/issues
license: GPL-2.0-only
issues: https://github.com/ogra1/ubuntu-core-model-builder/issues
source-code: https://github.com/ogra1/ubuntu-core-model-builder
website: https://github.com/ogra1/ubuntu-core-model-builder

confinement: classic
grade: stable
base: core24

platforms:
  amd64:
  arm64:

lint:
  ignore:
    - classic:
      - usr/lib/x86_64-linux-gnu/dri/libdril_dri.so
      - usr/lib/x86_64-linux-gnu/libffi.so.8.1.4
      - usr/lib/x86_64-linux-gnu/libgallium-25.2.8-0ubuntu0.24.04.2.so
      - usr/lib/x86_64-linux-gnu/libwayland-client.so.0.22.0
    - library:
      - usr/lib/x86_64-linux-gnu/libEGL.so.1.1.0
      - usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libGL.so.1.7.0
      - usr/lib/x86_64-linux-gnu/libGLESv2.so.2.1.0
      - usr/lib/x86_64-linux-gnu/libGLX_mesa.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libcolordprivate.so.2.0.5
      - usr/lib/x86_64-linux-gnu/libdconf.so.1.0.0
      - usr/lib/x86_64-linux-gnu/libgirepository-1.0.so.1.0.
      - usr/lib/x86_64-linux-gnu/libglapi.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libgthread-2.0.so.0.8000.0
      - usr/lib/x86_64-linux-gnu/libibus-1.0.so.5.0.529
      - usr/lib/x86_64-linux-gnu/libicuio.so.74.2
      - usr/lib/x86_64-linux-gnu/libicutest.so.74.2
      - usr/lib/x86_64-linux-gnu/libpcre2-16.so.0.11.2
      - usr/lib/x86_64-linux-gnu/libpcre2-32.so.0.11.2
      - usr/lib/x86_64-linux-gnu/libpcre2-posix.so.3.0.4
      - usr/lib/x86_64-linux-gnu/libvulkan.so.1.3.275
      - usr/lib/x86_64-linux-gnu/libGLX.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libXxf86vm.so.1.0.0
      - usr/lib/x86_64-linux-gnu/libicutu.so.74.2
      - usr/lib/x86_64-linux-gnu/libxcb-glx.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libGLdispatch.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libicui18n.so.74.2
      - usr/lib/x86_64-linux-gnu/libgirepository-1.0.so.1.0.0

apps:
  model-builder:
    command: bin/ubuntu_core_model_builder
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/bin/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
      GDK_BACKEND: x11
      LIBGL_DRIVERS_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      GTK_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-3.0
      GIO_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules

parts:
  flutter-git:
    plugin: nil
    source: .
    source-type: git
    override-pull: |
      # necessary when reruns using the same container
      if [ -d "flutter" ]; then
        rm -rf "flutter"
      fi

      craftctl default

      FLUTTER_VERSION=3.44.0
      git clone -b ${FLUTTER_VERSION} --depth 1 https://github.com/flutter/flutter.git
    override-build: |
      if [ $CRAFT_ARCH_BUILD_FOR = riscv64 ]; then
        export FLUTTER_STORAGE_BASE_URL=https://flutter-experimental.ubuntu.com
      fi

      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      cp -r $CRAFT_PART_SRC/flutter $CRAFT_PART_INSTALL/usr/libexec/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/flutter $CRAFT_PART_INSTALL/usr/bin/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/dart $CRAFT_PART_INSTALL/usr/bin/dart
      $CRAFT_PART_INSTALL/usr/bin/flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
    override-prime: ""
  model-builder:
    after: [flutter-git]
    plugin: nil
    source: .
    build-attributes: [enable-patchelf]
    override-build: |
      set -eux
      mkdir -p $CRAFT_PART_INSTALL/bin
      git submodule update --init --recursive

      flutter pub get
      flutter build linux --release -v
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
  libraries:
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - libatk1.0-0t64
      - libcairo-gobject2
      - libcairo2
      - libegl-mesa0
      - libegl1
      - libelf1t64
      - libgl1
      - libgles2
      - libglib2.0-0t64
      - libglib2.0-dev
      - libgirepository-1.0-1
      - libgtk-3-0t64
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpng16-16t64
      - libwayland-egl1
      - libx11-6
      - libdatrie1
      - libdrm2
      - libgbm1
      - libglapi-mesa
      - libgraphite2-3
      - libxshmfence1
      - libpciaccess0
      - libvulkan1
      - shared-mime-info
      - libglib2.0-bin
      - libibus-1.0-5
  dri-no-patchelf:
    after: [libraries]
    plugin: nil
    stage-packages:
      - libgl1-mesa-dri
    build-attributes:
      - no-patchelf # Otherwise snapcraft may strip the build ID and cause the driver to crash
    stage:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      - usr/share/drirc.d
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgallium*
  surl:
    plugin: nil
    source: https://github.com/canonical/surl.git
    source-type: git
    source-commit: 3e83328161f0d79ecdb15a6a0a3bcde8f5ab41cb
    build-packages:
      - patchelf
      - python3
      - python3-venv
      - python3-pip
      - git
      - build-essential
      - libffi-dev
    override-build: |
      set -eux
      venv="$CRAFT_PART_INSTALL/usr/share/surl-venv"
      python3 -m venv "$venv"
      "$venv/bin/pip" install --upgrade pip
      "$venv/bin/pip" install -r "$CRAFT_PART_SRC/requirements.txt"
      "$venv/bin/pip" install "$CRAFT_PART_SRC"
      test -f "$venv/bin/surl_cli.py"
    override-prime: |
      craftctl default

      BASE="core24"

      RPATH="/snap/$BASE/current/lib/x86_64-linux-gnu"
      INTERP="/snap/$BASE/current/lib64/ld-linux-x86-64.so.2"

      patchelf --force-rpath --set-rpath $RPATH $CRAFT_PRIME/usr/bin/python3.12
      patchelf --set-interpreter $INTERP $CRAFT_PRIME/usr/bin/python3.12

      for file in $CRAFT_PRIME/usr/lib/python3.12/lib-dynload/*; do
          patchelf --force-rpath --set-rpath "\$ORIGIN/lib:$RPATH" $file;
      done

      patchelf --force-rpath --set-rpath "\$ORIGIN/lib:\$ORIGIN/../../x86_64-linux-gnu:$RPATH" \
                                          $CRAFT_PRIME/usr/lib/python3.12/lib-dynload/_ctypes.cpython-312-x86_64-linux-gnu.so

      for file in $(find $CRAFT_PRIME/usr/share/surl-venv/lib/python3.12/site-packages/ -name *.so); do
          patchelf --force-rpath --set-rpath $RPATH $file
      done
    stage-packages:
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - ca-certificates
      - libffi8
      - libssl3
