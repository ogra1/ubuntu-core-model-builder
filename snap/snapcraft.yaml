name: model-builder
title: Model Builder
version: '0.1.9'
summary: GUI for creating and signing Ubuntu Core model assertions
description: |
  A graphical tool to create, edit, and sign Ubuntu Core model
  assertions. Searches the snap store, resolves snap IDs automatically,
  manages signing keys, and integrates with snapcraft.

contact: https://github.com/ogra1/ubuntu-core-model-builder/issues
license: GPL-2.0-only
issues: https://github.com/ogra1/ubuntu-core-model-builder/issues
source-code: https://github.com/ogra1/ubuntu-core-model-builder
website: https://github.com/ogra1/ubuntu-core-model-builder

confinement: classic
grade: stable
base: core24
compression: lzo

platforms:
  amd64:
  arm64:

lint:
  ignore:
    - classic:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri/libdril_dri.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libffi.so.8.1.4
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgallium-25.2.8-0ubuntu0.24.04.4.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libwayland-client.so.0.22.0
    - library:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libEGL.so.1.1.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libEGL_mesa.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGL.so.1.7.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLESv2.so.2.1.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLX_mesa.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libcolordprivate.so.2.0.5
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdconf.so.1.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgirepository-1.0.so.1.0.
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libglapi.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgthread-2.0.so.0.8000.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libibus-1.0.so.5.0.529
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicuio.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicutest.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpcre2-16.so.0.11.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpcre2-32.so.0.11.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpcre2-posix.so.3.0.4
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan.so.1.3.275
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLX.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libXxf86vm.so.1.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicutu.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libxcb-glx.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLdispatch.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicui18n.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgirepository-1.0.so.1.0.0

apps:
  model-builder:
    command: bin/ubuntu_core_model_builder
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/bin/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
      # Rust auth backend (libsnapstore_auth.so), built by the
      # snapstore-auth-rust part and primed next to the app binary.
      SNAPSTORE_AUTH_LIB: $SNAP/bin/libsnapstore_auth.so
      GDK_BACKEND: x11
      LIBGL_DRIVERS_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      GTK_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-3.0
      GIO_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules

parts:
  flutter-git:
    plugin: nil
    source: .
    source-type: git
    override-pull: |
      # necessary when reruns using the same container
      if [ -d "flutter" ]; then
        rm -rf "flutter"
      fi

      craftctl default

      FLUTTER_VERSION=3.47.0
      git clone -b ${FLUTTER_VERSION} --depth 1 https://github.com/flutter/flutter.git
    override-build: |
      if [ $CRAFT_ARCH_BUILD_FOR = riscv64 ]; then
        export FLUTTER_STORAGE_BASE_URL=https://flutter-experimental.ubuntu.com
      fi

      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      cp -r $CRAFT_PART_SRC/flutter $CRAFT_PART_INSTALL/usr/libexec/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/flutter $CRAFT_PART_INSTALL/usr/bin/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/dart $CRAFT_PART_INSTALL/usr/bin/dart
      $CRAFT_PART_INSTALL/usr/bin/flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
    override-prime: ""
  snapstore-auth-rust:
    # Builds the shared Snap Store auth backend (libsnapstore_auth.so) that
    # the app loads via dart:ffi (see lib/services/ffi/snapstore_auth_client.dart,
    # which re-exports package:snapstore_auth). The crate + Dart client + mock
    # store now live in their own repo so other Flutter apps can reuse them.
    #
    # Source: the shared repo (same ref the pubspec git dependency pins).
    # For fully reproducible builds, prefer `source-commit` over a branch.

    # Self-contained crate: pure-Rust TLS (rustls/ring -- no OpenSSL) and the
    # built .so links only against libc/libm/libgcc_s, so no stage-packages
    # are needed; in a classic snap the base libraries resolve from the host
    # at runtime. A pinned Rust toolchain is installed via rustup into the
    # build dir (no host toolchain assumptions), and the crate is compiled
    # with the `minimal` profile for a lean cdylib.
    #
    # The library is primed into bin/ (-> $SNAP/bin/libsnapstore_auth.so),
    # which is where the Dart FFI client probes first (next to the
    # executable); SNAPSTORE_AUTH_LIB is set in the app environment as well.
    plugin: nil
    source: https://github.com/ogra1/snapstore-auth.git
    source-type: git
    source-branch: main
    build-packages:
      - build-essential   # cc for ring's C shim
      - curl
      - ca-certificates
      - patchelf
    override-build: |
      set -ex
      set +u
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup"
      export CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs           | sh -s -- -y --profile minimal --default-toolchain stable

      . "$CARGO_HOME/env"
      rustc --version
      cargo --version

      # Test the library and build the cdylib.
      # (The tests/mock_http.rs repro uses the repo's own copy of
      # tool/mock_store.py, resolved relative to the part's source dir.)
      # Launchpad build containers run behind a firewall proxy: reqwest
      # honors HTTP_PROXY even for loopback, so exempt 127.0.0.1/localhost
      # for the in-process fake store (the tests set this themselves too;
      # this is defense in depth).
      export NO_PROXY="127.0.0.1,localhost,${NO_PROXY}"
      export no_proxy="127.0.0.1,localhost,${no_proxy}"
      cargo test --release --lib --test integration --test isolate_http
      cargo build --release

      # Cargo builds into $CRAFT_PART_BUILD (the part's build dir); the
      # built cdylib is primed next to the app binary.
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp -v "$CRAFT_PART_BUILD/target/release/libsnapstore_auth.so" \
          "$CRAFT_PART_INSTALL/bin/libsnapstore_auth.so"

      # Fail fast if any C-ABI entry point the Dart binding resolves
      # (package:snapstore_auth) is missing from the built library. The
      # symbol list is dumped to a file first: under `set -o pipefail`
      # (snapcraft enables it) the early exit of `grep -q` can SIGPIPE `nm`
      # (exit 141) and fail the part.
      LIB="$CRAFT_PART_INSTALL/bin/libsnapstore_auth.so"
      nm -D "$LIB" > "$CRAFT_PART_BUILD/exports.txt"
      for sym in auth_account_info auth_authorization_header auth_cancel \
                 auth_drain_events auth_free_string auth_import_exported_login \
                 auth_logout auth_pending_events auth_register_key \
                 auth_restore_credentials auth_runtime_get auth_runtime_init \
                 auth_start_login auth_state auth_store_snaps \
                 auth_submit_2fa_code auth_submit_credentials auth_whoami; do
          grep -q " T $sym\$" "$CRAFT_PART_BUILD/exports.txt"
      done

    override-prime: |
      craftctl default
      BASE="core24"
      patchelf --force-rpath --set-rpath "/snap/$BASE/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR" \
          $CRAFT_PART_INSTALL/bin/libsnapstore_auth.so

  model-builder:
    after: [flutter-git, snapstore-auth-rust]
    plugin: nil
    source: .
    build-attributes: [enable-patchelf]
    build-packages:
      - libsecret-1-dev
    stage-packages:
      - libsecret-1-0
    override-build: |
      set -ex
      set +u
      mkdir -p $CRAFT_PART_INSTALL/bin
      git submodule update --init --recursive

      flutter pub get
      # required for the test suite
      export SNAPSTORE_AUTH_LIB=$CRAFT_STAGE/bin/libsnapstore_auth.so
      # run the whole test suite
      flutter test

      # build the app
      flutter build linux --release -v
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
  libraries:
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - libatk1.0-0t64
      - libcairo-gobject2
      - libcairo2
      - libegl-mesa0
      - libegl1
      - libelf1t64
      - libgl1
      - libgles2
      - libglib2.0-0t64
      - libglib2.0-dev
      - libgirepository-1.0-1
      - libgtk-3-0t64
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpng16-16t64
      - libwayland-egl1
      - libx11-6
      - libdatrie1
      - libdrm2
      - libgbm1
      - libglapi-mesa
      - libgraphite2-3
      - libxshmfence1
      - libpciaccess0
      - libvulkan1
      - shared-mime-info
      - libglib2.0-bin
      - libibus-1.0-5
    stage:
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgallium-*
  dri-no-patchelf:
    after: [libraries]
    plugin: nil
    stage-packages:
      - libgl1-mesa-dri
    build-attributes:
      - no-patchelf # Otherwise snapcraft may strip the build ID and cause the driver to crash
    stage:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      - usr/share/drirc.d
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgallium*
